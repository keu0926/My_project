<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}FLTOOS+ 학습플래너{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="icon" type="image/png" href="{% static 'images/logo-round.png' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, sans-serif; letter-spacing: -0.02em; }
        body { background-color: #f5f5f7; color: #1d1d1f; min-height: 100vh; display: flex; flex-direction: column; }
        .planner-header { position: sticky; top: 0; z-index: 100; height: 60px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid #e5e5ea; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
        .planner-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1d1d1f; }
        .planner-brand-badge { background-color: #1d1d1f; color: #ffffff; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 980px; letter-spacing: 0.04em; }
        .planner-brand-BadgePlus { color: #30d5c8; }
        .planner-brand-title { font-size: 17px; font-weight: 700; color: #1d1d1f; }
        .planner-header-right { display: flex; align-items: center; gap: 12px; }
        .planner-user-pill { font-size: 13.5px; font-weight: 600; color: #1d1d1f; background-color: #f5f5f7; border: 1px solid #d2d2d7; padding: 6px 14px; border-radius: 980px; }
        .planner-user-pill strong { color: #0071e3; }
        .planner-exit-btn { font-size: 13px; font-weight: 600; color: #6e6e73; text-decoration: none; padding: 6px 12px; border-radius: 980px; border: 1px solid #d2d2d7; background-color: #ffffff; transition: all 0.2s ease; }
        .planner-exit-btn:hover { color: #1d1d1f; border-color: #1d1d1f; }
        .planner-container { max-width: 1120px; width: 100%; margin: 0 auto; padding: 32px 20px 60px; flex: 1; }
        @media (max-width: 768px) { .planner-header { padding: 0 16px; height: 54px; } .planner-brand-title { font-size: 15px; } .planner-container { padding: 20px 16px 40px; } }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="planner-header">
        <a href="{% url 'planner:dashboard' %}" class="planner-brand">
            <span class="planner-brand-badge">FLTOOS<span class="planner-brand-BadgePlus">+</span></span>
            <span class="planner-brand-title">STUDY PLANNER</span>
        </a>
        <div class="planner-header-right">
            <div class="planner-user-pill"><strong>{{ user_display_name }}</strong>님</div>
            <a href="/" class="planner-exit-btn">홈으로</a>
        </div>
    </header>
    <main class="planner-container">{% block content %}{% endblock %}</main>
    {% block extra_js %}{% endblock %}
</body>
</html>
