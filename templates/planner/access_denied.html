<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 권한 안내 - 대치플투스학원</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        body { margin: 0; background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .denied-card { max-width: 440px; width: 100%; background: #ffffff; border-radius: 24px; padding: 40px 32px; text-align: center; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06); border: 1px solid rgba(0, 0, 0, 0.06); }
        .denied-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 59, 48, 0.1); color: #ff3b30; font-size: 26px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        h2 { font-size: 22px; font-weight: 700; color: #1d1d1f; margin: 0 0 12px; }
        p { font-size: 15px; color: #6e6e73; line-height: 1.6; margin: 0 0 28px; }
        .btn-home { display: inline-block; width: 100%; padding: 14px 0; background-color: #0071e3; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; border-radius: 14px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="denied-card">
        <div class="denied-icon">🔒</div>
        <h2>학습플래너 접근 권한이 필요합니다</h2>
        <p>FLTOOS+ 학습플래너는 재원생 전용 공간입니다.<br>관리자(선생님)에게 사용 권한 승인을 요청해 주세요.</p>
        <a href="/" class="btn-home">홈페이지로 돌아가기</a>
    </div>
</body>
</html>
