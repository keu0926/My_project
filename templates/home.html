<!-- 부모 틀을 가져와서 구멍을 채웁니다 -->
{% extends 'base.html' %}
{% load static %}

{% block title %}대치플투스학원입니다.{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/style-home.css' %}">
{% endblock %}

{% block content %}
    <script>
        // 홈 재방문 시 인트로 즉시 숨김 처리
        if (sessionStorage.getItem('introVisited') === 'true') {
            const intro = document.getElementById('intro-screen');
            if (intro) intro.classList.add('no-transition', 'hide');
        } else {
            document.body.classList.add('intro-active');
        }
    </script>

    <!-- 상단 배너 조각 삽입 -->
    {% include 'partials/banner.html' with banner_title="2026년 대규모 프로젝트 시작!" %}
{% endblock %}
