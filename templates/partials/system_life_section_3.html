{% load static %}

<section class="firewall-section">
  <div class="firewall-wrapper">
    <div class="firewall-card reveal-up">
      
      <!-- 왼쪽: 텍스트 설명 영역 -->
      <div class="firewall-text-area">
        <p class="firewall-eyebrow">철저한 보안, 완벽한 차단</p>
        <h2 class="firewall-title">강력한 방화벽으로<br>유해 사이트를 원천 차단</h2>
        <p class="firewall-desc">
          인터넷 강의 이외의 사이트는 차단하여,<br>

        </p>

      <!-- 오른쪽: 가로형 3D 방패 보안 배너 이미지 -->
      <div class="firewall-image-area">
        <img src="{% static 'images/protection.png' %}" alt="게임·동영상 사이트 차단, 메신저·SNS 사용 제한, 비학습 유해 사이트 차단 3D 방패 그래픽">

    </div>
