{% load static %} 

<!-- 네 번째 섹션: 학부모와의 실시간 소통 (좌측 타이틀 + 중앙 알림 카드 + 우측 배경 스마트폰) -->
<section class="comm-section">
  <div class="comm-inner reveal-up">
    
    <!-- 1열: 왼쪽 타이틀 영역 -->
    <div class="comm-text-col">
      <p class="comm-eyebrow">학생의 일상까지 함께합니다</p>
      <h2 class="comm-title">학부모님과의<br>실시간 소통</h2>
      <p class="comm-desc">
        자녀의 학습 완성도와 원내 생활 상태를<br>
        언제 어디서나 실시간 카카오톡 알림으로<br>
        확인할 수 있습니다.
      </p>
    </div>

    <!-- 2열: 글자 오른쪽에 배치된 2단 알림 카드 -->
    <div class="noti-list">
      <div class="noti-item">
        <div class="noti-icon blue-tint">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <div class="noti-body">
          <div class="noti-top">
            <strong>일일 학습 리포트 알림</strong>
            <span>오후 6:20</span>
          </div>
          <p>오늘의 인강 진도 및 태블릿 모니터링이 완료되었습니다.</p>
        </div>
      </div>

      <div class="noti-item">
        <div class="noti-icon green-tint">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="noti-body">
          <div class="noti-top">
            <strong>원내 생활 및 학습 현장 안내</strong>
            <span>오후 4:32</span>
          </div>
          <p>집중도 있게 자습에 참여 중인 현장 사진과 코멘트가 도착했습니다.</p>
        </div>
      </div>
    </div>

  </div>
</section>
